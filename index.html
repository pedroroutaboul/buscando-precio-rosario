<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscando Precio Rosario</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5G09T95MTD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-5G09T95MTD');
</script>
<body>
    <div class="container">
        <h1 class="text-center my-4">Buscando Precio Rosario</h1>
        
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar productos...">
            <button onclick="searchProducts()">Buscar</button>
        </div>

        <div id="loadingIndicator" style="display: none;">
            <div class="loading">Buscando productos...</div>
        </div>

        <div id="errorMessage" style="display: none;" class="error"></div>

        <div class="results-container mt-4">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Supermercado</th>
                    </tr>
                </thead>
                <tbody id="resultsBody">
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
